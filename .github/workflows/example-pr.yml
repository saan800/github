name: example-pr

on:
  pull_request:

permissions:
  actions: read
  contents: write
  packages: write
  pull-requests: write
  security-events: write

jobs:
  dotnet-package-pr:
    permissions:
      actions: read
      contents: write
      packages: write
      pull-requests: write
      security-events: write
    uses: ./.github/workflows/dotnet-package-pr.yml
    with:
      working-directory: "./examples/NugetPackages"
      os: ubuntu-latest
      dotnet-version: 10.0.x
      codecov-name: "example-dotnet-package"
    secrets: inherit

  dotnet-minimal-web-api-pr:
    permissions:
      actions: read
      contents: read
      pull-requests: write
      security-events: write
    uses: ./.github/workflows/dotnet-pr.yml
    with:
      working-directory: "./examples/MinimalWebApi"
      os: "ubuntu-latest"
      dotnet-version: "10.0.x"
      codecov-name: "example-minimal-web-api"
    secrets: inherit
